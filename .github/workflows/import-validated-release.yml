name: Import validated Royadarman release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-validated-release.yml'

permissions:
  contents: write

jobs:
  import-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify validated source archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://royadarman.com/release-import-43c4dde62ca6e5da2f81f800c81add8d.tar.gz' \
            --output /tmp/royadarman-release.tar.gz
          echo '76538114f56fe4b8bd81fce1f821d744ce23b9fd486a77b663716f44b60dd49a  /tmp/royadarman-release.tar.gz' | sha256sum -c -

      - name: Replace repository with validated tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --quiet .
          tar -xzf /tmp/royadarman-release.tar.gz -C .
          git add -A
          actual_tree="$(git write-tree)"
          expected_tree='736f1fd5b633cb8629fdf6c44e6cc91da08c0cb0'
          echo "Validated tree: ${actual_tree}"
          test "${actual_tree}" = "${expected_tree}"

      - name: Commit exact validated release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Royadarman Release Automation'
          git config user.email '49054922+maziyarid@users.noreply.github.com'
          git commit -m 'feat: launch complete multilingual site and product backend'
          git push origin HEAD:main
