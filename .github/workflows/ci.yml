name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, gd, fileinfo
          coverage: none

      - name: Verify PHP runtime version
        run: |
          php -v
          php -r 'exit(version_compare(PHP_VERSION, "8.3.0", ">=") ? 0 : 1);'

      - name: Validate composer manifest
        run: composer validate --strict --no-check-lock

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies from lock
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        env:
          # CI-only test lookup secret. Never reuse in production. The real
          # production secret is injected by the operator at deploy time and is
          # never present in the repository or CI.
          ROYADARMAN_PHONE_HASH_KEY: ci-test-phone-lookup-key-do-not-use-in-production
        run: |
          cp .env.example .env
          php artisan key:generate
          # The template intentionally has NO active ROYADARMAN_PHONE_HASH_KEY
          # assignment (it is a commented required variable). Append the CI-only
          # test key directly so the preflight gate passes. This value never
          # enters production configuration.
          echo "ROYADARMAN_PHONE_HASH_KEY=ci-test-phone-lookup-key-do-not-use-in-production" >> .env
          php artisan config:clear

      - name: Migrate clean test database (SQLite :memory:)
        run: php artisan migrate --force

      - name: Configuration/template safety preflight (intake stays disabled)
        run: php artisan royadarman:preflight

      - name: PHPUnit test suite
        run: php artisan test --compact

      - name: Pint lint
        run: vendor/bin/pint --test

      - name: Route registration sanity
        run: php artisan route:list

      - name: Route caching + cached boot sanity
        run: |
          php artisan route:cache
          php artisan route:list
          php artisan route:clear

      - name: Config cache sanity
        run: |
          php artisan config:cache
          php artisan config:clear

      - name: Dependency audit (security advisories, informational)
        run: composer audit --locked || true

  frontend:
    name: Frontend (backend Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install from lock
        run: npm ci

      - name: High-severity audit
        run: npm audit --audit-level=high

      - name: Build real frontend (backend/resources)
        run: npm run build

      - name: Ensure no orphaned editor backup files
        working-directory: .
        run: |
          set -e
          found=$(find . -not -path './.git/*' -not -path '*/vendor/*' -not -path '*/node_modules/*' \( -name '*.bak' -o -name '*.bak.*' -o -name '*.orig' -o -name '*~' \) -print | grep . || true)
          if [ -n "$found" ]; then
            echo "Found editor backup files that must not be committed:"
            echo "$found"
            exit 1
          fi

  locale-render:
    name: Locale render parity (fa/ar/en)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, gd, fileinfo
          coverage: none

      - name: Install dependencies from lock
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        env:
          ROYADARMAN_PHONE_HASH_KEY: ci-test-phone-lookup-key-do-not-use-in-production
        run: |
          cp .env.example .env
          php artisan key:generate
          echo "ROYADARMAN_PHONE_HASH_KEY=ci-test-phone-lookup-key-do-not-use-in-production" >> .env
          php artisan config:clear

      - name: Locale parity feature test
        run: php artisan test --filter=LocaleAndAuthorizationTest
