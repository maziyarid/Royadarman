:root {
  color-scheme: light;
  --canvas: #f5f7f5;
  --canvas-soft: #eef3f0;
  --surface: #ffffff;
  --surface-subtle: #f8faf8;
  --ink: #17211f;
  --ink-soft: #42504d;
  --muted: #66736f;
  --line: #dfe7e3;
  --line-strong: #cdd9d4;
  --brand: #0b6b61;
  --brand-hover: #07584f;
  --brand-soft: #e5f3ef;
  --brand-pale: #f1f8f6;
  --accent: #f4b544;
  --accent-soft: #fff3d9;
  --success: #237a4b;
  --success-soft: #e5f5ec;
  --warning: #875205;
  --warning-soft: #fff1d6;
  --danger: #bd3f4a;
  --danger-soft: #fdebed;
  --info: #2e65b0;
  --info-soft: #eaf1fb;
  --violet: #6d55b5;
  --violet-soft: #f0ecfb;
  --shadow-xs: 0 1px 2px rgba(20, 43, 36, .05);
  --shadow-sm: 0 8px 24px rgba(20, 43, 36, .07);
  --shadow-md: 0 18px 46px rgba(20, 43, 36, .11);
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 22px;
  --radius-xl: 30px;
  --sidebar-width: 282px;
  --topbar-height: 76px;
  --role-accent: var(--brand);
  --role-soft: var(--brand-soft);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background: var(--canvas);
  color: var(--ink);
  font-family: "Irancell", Tahoma, sans-serif;
  font-size: 15px;
  line-height: 1.75;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select,
textarea {
  font: inherit;
}

button,
a,
input,
select,
textarea,
summary {
  -webkit-tap-highlight-color: transparent;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

img,
svg {
  display: block;
  max-width: 100%;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1,
h2,
h3 {
  line-height: 1.42;
}

ul,
ol {
  margin-top: 0;
}

.skip-link {
  position: fixed;
  z-index: 1000;
  inset-inline-start: 1rem;
  top: -5rem;
  padding: .75rem 1rem;
  border-radius: var(--radius-sm);
  background: var(--ink);
  color: #fff;
  box-shadow: var(--shadow-md);
}

.skip-link:focus {
  top: 1rem;
}

:focus-visible {
  outline: 3px solid var(--role-accent);
  outline: 3px solid color-mix(in srgb, var(--role-accent) 35%, transparent);
  outline-offset: 3px;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.icon {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}

.icon-sm {
  width: 17px;
  height: 17px;
}

.boot-screen {
  min-height: 100vh;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 1rem;
  color: var(--muted);
}

.brand-symbol {
  display: inline-grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border-radius: 17px;
  background: var(--brand);
  color: #fff;
  font-size: 1.65rem;
  font-weight: 800;
  box-shadow: 0 10px 25px rgba(11, 107, 97, .23);
}

.boot-loader {
  width: 32px;
  height: 32px;
  border: 3px solid var(--brand-soft);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Demo access */
.access-page {
  min-height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 8% 8%, rgba(244, 181, 68, .14), transparent 26rem),
    radial-gradient(circle at 88% 75%, rgba(11, 107, 97, .12), transparent 32rem),
    #f7faf8;
}

.access-header {
  width: min(1240px, calc(100% - 2rem));
  min-height: 82px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  border-bottom: 1px solid rgba(205, 217, 212, .75);
}

.brand-lockup {
  display: inline-flex;
  align-items: center;
  gap: .75rem;
}

.brand-lockup .brand-symbol {
  width: 43px;
  height: 43px;
  border-radius: 14px;
  font-size: 1.35rem;
}

.brand-copy strong {
  display: block;
  font-weight: 800;
  font-size: 1.05rem;
}

.brand-copy small {
  display: block;
  margin-top: -.15rem;
  color: var(--muted);
  font-size: .72rem;
}

.demo-badge {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  min-height: 36px;
  padding: .35rem .75rem;
  border: 1px solid #d5e6e0;
  border-radius: 999px;
  background: rgba(255, 255, 255, .75);
  color: var(--brand);
  font-size: .76rem;
  font-weight: 700;
  backdrop-filter: blur(10px);
}

.demo-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 0 5px var(--success-soft);
}

.access-main {
  width: min(1240px, calc(100% - 2rem));
  margin: 0 auto;
  padding: clamp(2.5rem, 6vw, 5.5rem) 0 3rem;
}

.access-intro {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(320px, .9fr);
  align-items: center;
  gap: clamp(2rem, 5vw, 5.5rem);
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  margin-bottom: 1rem;
  color: var(--brand);
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: .02em;
}

.eyebrow::before {
  content: "";
  width: 22px;
  height: 2px;
  border-radius: 999px;
  background: currentColor;
}

.access-copy h1 {
  max-width: 730px;
  margin-bottom: 1rem;
  font-size: clamp(2.25rem, 5vw, 4.6rem);
  font-weight: 800;
  letter-spacing: -.055em;
}

.access-copy h1 span {
  color: var(--brand);
}

.access-copy > p {
  max-width: 690px;
  margin-bottom: 1.6rem;
  color: var(--ink-soft);
  font-size: clamp(.95rem, 1.5vw, 1.1rem);
}

.access-facts {
  display: flex;
  flex-wrap: wrap;
  gap: .7rem 1.35rem;
  padding: 0;
  margin: 0;
  list-style: none;
  color: var(--muted);
  font-size: .82rem;
}

.access-facts li {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
}

.access-facts .icon {
  color: var(--success);
}

.route-visual {
  position: relative;
  min-height: 360px;
  display: grid;
  place-items: center;
}

.route-visual::before,
.route-visual::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(11, 107, 97, .15);
}

.route-visual::before {
  width: 320px;
  height: 320px;
}

.route-visual::after {
  width: 240px;
  height: 240px;
  border-style: dashed;
}

.route-core {
  position: relative;
  z-index: 2;
  width: 168px;
  height: 168px;
  display: grid;
  place-content: center;
  text-align: center;
  border: 10px solid rgba(255, 255, 255, .75);
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  box-shadow: 0 28px 70px rgba(11, 107, 97, .24);
}

.route-core strong {
  font-size: 2rem;
  line-height: 1;
}

.route-core span {
  margin-top: .35rem;
  font-size: .72rem;
  opacity: .8;
}

.route-node {
  position: absolute;
  z-index: 3;
  min-width: 106px;
  padding: .65rem .8rem;
  display: flex;
  align-items: center;
  gap: .5rem;
  border: 1px solid rgba(205, 217, 212, .85);
  border-radius: 14px;
  background: rgba(255, 255, 255, .9);
  box-shadow: var(--shadow-sm);
  color: var(--ink-soft);
  font-size: .76rem;
  font-weight: 700;
  backdrop-filter: blur(10px);
}

.route-node .icon { color: var(--brand); }
.route-node.node-a { top: 1rem; inset-inline-start: 12%; }
.route-node.node-b { top: 25%; inset-inline-end: 0; }
.route-node.node-c { bottom: 1.5rem; inset-inline-start: 6%; }
.route-node.node-d { bottom: 5%; inset-inline-end: 5%; }

.role-section {
  margin-top: clamp(3rem, 6vw, 5rem);
}

.section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.2rem;
}

.section-heading h2 {
  margin-bottom: .2rem;
  font-size: clamp(1.45rem, 2.6vw, 2rem);
}

.section-heading p {
  margin-bottom: 0;
  color: var(--muted);
  font-size: .86rem;
}

.role-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1rem;
}

.role-card {
  position: relative;
  min-height: 245px;
  padding: 1.35rem;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: rgba(255, 255, 255, .88);
  box-shadow: var(--shadow-xs);
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}

.role-card::after {
  content: "";
  position: absolute;
  width: 130px;
  height: 130px;
  inset-inline-end: -55px;
  top: -55px;
  border-radius: 50%;
  background: var(--card-soft);
}

.role-card:hover {
  transform: translateY(-4px);
  border-color: color-mix(in srgb, var(--card-accent) 35%, var(--line));
  box-shadow: var(--shadow-md);
}

.role-card.patient { --card-accent: var(--brand); --card-soft: var(--brand-soft); }
.role-card.clinic { --card-accent: var(--info); --card-soft: var(--info-soft); }
.role-card.admin { --card-accent: var(--violet); --card-soft: var(--violet-soft); }

.role-icon {
  position: relative;
  z-index: 2;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  margin-bottom: 1rem;
  border-radius: 15px;
  background: var(--card-soft);
  color: var(--card-accent);
}

.role-card h3 {
  margin-bottom: .35rem;
  font-size: 1.15rem;
}

.role-card p {
  margin-bottom: 1.2rem;
  color: var(--muted);
  font-size: .83rem;
}

.role-card footer {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .8rem;
}

.page-count {
  color: var(--muted);
  font-size: .73rem;
}

.enter-button {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
  padding: .65rem .9rem;
  border: 0;
  border-radius: 12px;
  background: var(--card-accent);
  color: #fff;
  font-weight: 700;
  transition: filter .2s ease;
}

.enter-button:hover,
.enter-button:focus-visible {
  filter: brightness(.92);
}

.access-footer {
  width: min(1240px, calc(100% - 2rem));
  margin: 2.8rem auto 0;
  padding: 1.2rem 0 2rem;
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: .74rem;
}

/* Application shell */
.app-shell {
  --role-accent: var(--brand);
  --role-soft: var(--brand-soft);
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
}

.app-shell.role-clinic {
  --role-accent: var(--info);
  --role-soft: var(--info-soft);
}

.app-shell.role-admin {
  --role-accent: var(--violet);
  --role-soft: var(--violet-soft);
}

.sidebar {
  position: sticky;
  z-index: 40;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-inline-end: 1px solid var(--line);
  background: rgba(255, 255, 255, .96);
}

.sidebar-head {
  min-height: var(--topbar-height);
  padding: .85rem 1.15rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .6rem;
  border-bottom: 1px solid var(--line);
}

.sidebar-head .brand-symbol {
  width: 39px;
  height: 39px;
  border-radius: 13px;
  font-size: 1.2rem;
  background: var(--role-accent);
  box-shadow: none;
}

.sidebar-close {
  display: none;
}

.role-label {
  margin: .8rem 1rem .2rem;
  padding: .65rem .8rem;
  display: flex;
  align-items: center;
  gap: .65rem;
  border-radius: 12px;
  background: var(--role-soft);
  color: var(--role-accent);
  font-size: .78rem;
  font-weight: 700;
}

.nav-search-wrap {
  position: relative;
  padding: .55rem 1rem .3rem;
}

.nav-search-wrap .icon {
  position: absolute;
  inset-inline-start: 1.75rem;
  top: 50%;
  transform: translateY(-43%);
  color: var(--muted);
  pointer-events: none;
}

.nav-search {
  width: 100%;
  height: 42px;
  padding: .55rem 2.4rem .55rem .75rem;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--surface-subtle);
  color: var(--ink);
  outline: none;
}

.nav-search:focus {
  border-color: var(--role-accent);
  background: #fff;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--role-accent) 12%, transparent);
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: .45rem .75rem 1rem;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}

.nav-group {
  margin-top: .8rem;
}

.nav-group-title {
  padding: .35rem .65rem;
  color: var(--muted);
  font-size: .68rem;
  font-weight: 700;
}

.nav-link {
  min-height: 43px;
  display: flex;
  align-items: center;
  gap: .7rem;
  padding: .58rem .68rem;
  margin: .12rem 0;
  border-radius: 11px;
  color: var(--ink-soft);
  font-size: .78rem;
  transition: background .15s ease, color .15s ease;
}

.nav-link:hover,
.nav-link:focus-visible {
  background: var(--canvas-soft);
  color: var(--ink);
}

.nav-link[aria-current="page"] {
  background: var(--role-soft);
  color: var(--role-accent);
  font-weight: 700;
}

.nav-link[hidden] {
  display: none;
}

.nav-link .icon {
  width: 18px;
  height: 18px;
}

.sidebar-foot {
  padding: .8rem 1rem 1rem;
  border-top: 1px solid var(--line);
}

.profile-mini {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: .7rem;
}

.avatar {
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: var(--role-soft);
  color: var(--role-accent);
  font-size: .78rem;
  font-weight: 800;
}

.profile-mini strong,
.profile-mini small {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.profile-mini strong { font-size: .78rem; }
.profile-mini small { color: var(--muted); font-size: .68rem; }

.app-workspace {
  min-width: 0;
  min-height: 100vh;
}

.topbar {
  position: sticky;
  z-index: 30;
  top: 0;
  min-height: var(--topbar-height);
  padding: .75rem clamp(1rem, 3vw, 2rem);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  border-bottom: 1px solid rgba(223, 231, 227, .88);
  background: rgba(245, 247, 245, .88);
  backdrop-filter: blur(18px);
}

.topbar-start,
.topbar-actions {
  display: flex;
  align-items: center;
  gap: .65rem;
}

.menu-button {
  display: none;
}

.icon-button {
  width: 44px;
  height: 44px;
  display: inline-grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink-soft);
  transition: border-color .15s ease, color .15s ease, background .15s ease;
}

.icon-button:hover,
.icon-button:focus-visible {
  border-color: color-mix(in srgb, var(--role-accent) 30%, var(--line));
  background: var(--role-soft);
  color: var(--role-accent);
}

.breadcrumb-mini {
  color: var(--muted);
  font-size: .76rem;
}

.breadcrumb-mini strong {
  color: var(--ink-soft);
}

.demo-switcher {
  position: relative;
}

.demo-switcher summary {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: .55rem;
  padding: .55rem .78rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink-soft);
  font-size: .76rem;
  font-weight: 700;
  list-style: none;
  cursor: pointer;
}

.demo-switcher summary::-webkit-details-marker { display: none; }

.switcher-menu {
  position: absolute;
  z-index: 60;
  inset-inline-end: 0;
  top: calc(100% + .55rem);
  width: 250px;
  padding: .55rem;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  box-shadow: var(--shadow-md);
}

.switcher-menu p {
  margin: .25rem .55rem .45rem;
  color: var(--muted);
  font-size: .69rem;
}

.switcher-option {
  width: 100%;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: .65rem;
  padding: .55rem .65rem;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--ink-soft);
  text-align: right;
}

.switcher-option:hover,
.switcher-option:focus-visible { background: var(--canvas-soft); }

.switcher-option.is-current { background: var(--role-soft); color: var(--role-accent); }

.content {
  width: min(1440px, 100%);
  margin: 0 auto;
  padding: clamp(1.2rem, 3vw, 2.1rem) clamp(1rem, 3vw, 2.2rem) 5rem;
}

.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1.5rem;
  margin-bottom: 1.35rem;
}

.page-head-copy { max-width: 780px; }

.page-kicker {
  margin-bottom: .35rem;
  color: var(--role-accent);
  font-size: .72rem;
  font-weight: 800;
}

.page-head h1 {
  margin-bottom: .35rem;
  font-size: clamp(1.55rem, 3vw, 2.2rem);
  font-weight: 800;
  letter-spacing: -.02em;
}

.page-head p {
  margin-bottom: 0;
  color: var(--muted);
  font-size: .86rem;
}

.page-head-actions {
  display: flex;
  align-items: center;
  gap: .55rem;
  flex-wrap: wrap;
}

.button {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .48rem;
  padding: .65rem .95rem;
  border: 1px solid transparent;
  border-radius: 12px;
  font-weight: 700;
  font-size: .8rem;
  transition: transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
}

.button:active { transform: translateY(1px); }
.button-primary { background: var(--role-accent); color: #fff; }
.button-primary:hover { filter: brightness(.92); }
.button-secondary { border-color: var(--line); background: var(--surface); color: var(--ink-soft); }
.button-secondary:hover { border-color: color-mix(in srgb, var(--role-accent) 28%, var(--line)); color: var(--role-accent); background: var(--role-soft); }
.button-danger { background: var(--danger); color: #fff; }
.button-quiet { background: transparent; color: var(--muted); }
.button-quiet:hover { color: var(--role-accent); background: var(--role-soft); }

.grid {
  display: grid;
  gap: 1rem;
}

.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-main { grid-template-columns: minmax(0, 1.6fr) minmax(280px, .7fr); }

.card {
  min-width: 0;
  padding: 1.15rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-xs);
}

.card-elevated { box-shadow: var(--shadow-sm); }

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1rem;
}

.card-head h2,
.card-head h3 {
  margin-bottom: .15rem;
  font-size: .98rem;
}

.card-head p {
  margin-bottom: 0;
  color: var(--muted);
  font-size: .73rem;
}

.metric-card {
  position: relative;
  min-height: 126px;
  overflow: hidden;
}

.metric-card::after {
  content: "";
  position: absolute;
  width: 85px;
  height: 85px;
  top: -38px;
  inset-inline-end: -32px;
  border-radius: 50%;
  background: var(--role-soft);
}

.metric-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
}

.metric-label { color: var(--muted); font-size: .76rem; }
.metric-value { margin-top: .45rem; font-size: 1.75rem; font-weight: 800; letter-spacing: -.03em; }
.metric-foot { display: flex; align-items: center; gap: .4rem; margin-top: .25rem; color: var(--muted); font-size: .68rem; }
.trend-up { color: var(--success); }
.trend-down { color: var(--danger); }

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: .33rem;
  max-width: 100%;
  min-height: 26px;
  padding: .18rem .55rem;
  border-radius: 999px;
  background: var(--canvas-soft);
  color: var(--ink-soft);
  font-size: .68rem;
  font-weight: 700;
  white-space: nowrap;
}

.status-badge::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.status-success { background: var(--success-soft); color: var(--success); }
.status-warning { background: var(--warning-soft); color: var(--warning); }
.status-danger { background: var(--danger-soft); color: var(--danger); }
.status-info { background: var(--info-soft); color: var(--info); }
.status-violet { background: var(--violet-soft); color: var(--violet); }

.list-stack {
  display: grid;
  gap: .65rem;
}

.list-row {
  min-width: 0;
  min-height: 62px;
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .72rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface-subtle);
}

.list-row:hover { border-color: var(--line-strong); background: #fff; }

.list-icon {
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--role-soft);
  color: var(--role-accent);
}

.list-copy {
  min-width: 0;
  flex: 1;
}

.list-copy strong,
.list-copy small {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.list-copy strong { font-size: .79rem; }
.list-copy small { color: var(--muted); font-size: .68rem; }

.chevron {
  color: var(--muted);
  transform: rotate(180deg);
}

.data-table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
}

.data-table {
  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
}

.data-table th,
.data-table td {
  padding: .85rem .95rem;
  border-bottom: 1px solid var(--line);
  text-align: right;
  vertical-align: middle;
}

.data-table th {
  background: var(--surface-subtle);
  color: var(--muted);
  font-size: .69rem;
  font-weight: 700;
}

.data-table td { font-size: .76rem; }
.data-table tr:last-child td { border-bottom: 0; }
.data-table tbody tr:hover { background: #fbfcfb; }

.row-main {
  display: flex;
  align-items: center;
  gap: .65rem;
}

.row-avatar {
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--role-soft);
  color: var(--role-accent);
  font-size: .68rem;
  font-weight: 800;
}

.progress {
  width: 100%;
  height: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--canvas-soft);
}

.progress > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--role-accent);
}

.alert {
  display: flex;
  align-items: flex-start;
  gap: .75rem;
  padding: .9rem 1rem;
  border: 1px solid color-mix(in srgb, var(--alert-color) 18%, var(--line));
  border-radius: 13px;
  background: var(--alert-bg);
  color: var(--alert-color);
}

.alert strong { display: block; margin-bottom: .15rem; font-size: .82rem; }

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

  ["hard filter", "شرط قطعی"], ["fallback", "مسیر جایگزین"], ["workflow", "فرایند"],
  ["history", "تاریخچه"], ["export", "خروجی"], ["retry", "تلاش دوباره"],
];

function fa(value) {
  let result = String(value ?? "");
  for (const [from, to] of translations) result = result.replaceAll(from, to);
  return result.replace(/\s+·\s*$/g, "").replace(/\s{2,}/g, " ").trim();
}

function keyFromSlug(slug) {
  return slug.split("/").pop().replace(".html", "").replace(/^\d+-/, "").replace("review-visit", "visit-feedback").replace("clinic-review", "clinic-assessment");
}

function preparePages(source, role) {
  return source.map((page, index) => ({
    ...page,
    role,
    key: keyFromSlug(page.slug),
    index,
    title: fa(page.title),
    lede: fa(page.lede),
    purpose: fa(page.purpose),
    primary: fa(page.primary),
    fields: (page.fields || []).map(fa),
    options: (page.options || []).map(fa),
    actions: (page.actions || []).map(fa),
    cards: (page.cards || []).map(fa),
    metrics: (page.metrics || []).map(([label, value]) => [fa(label), fa(value)]),
    states: (page.states || []).map(fa),
    rules: (page.rules || []).map(fa),
    empty: fa(page.empty),
    error: fa(page.error),
    kicker: fa(page.kicker),
    notice: fa(page.notice),
  }));
}

function stateLabel(state) {
  const key = String(state).toLowerCase().replaceAll(" ", "_");
  return STATE_LABELS[key] || state.replaceAll("_", " ");

function routeFor(role, key) {
  return `#/${role}/${key}`;
}

function currentRoute() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (!parts.length || parts[0] === "access") return { mode: "access" };
  const role = ROLE_META[parts[0]] ? parts[0] : null;
  return role ? { mode: "app", role, key: parts[1] || ROLE_META[role].default } : { mode: "access" };
}

function pageFor(role, key) {
  return pagesByRole[role].find((page) => page.key === key) || pagesByRole[role].find((page) => page.key === ROLE_META[role].default) || pagesByRole[role][0];
}

function metricValue(value, index, role) {
  if (value && value !== "—") return value;
  const pools = {
    patient: ["۱", "۲", "۴٫۸"],
    clinic: ["۲۴", "۵", "۹۸٪"],
    admin: ["۱٬۲۴۸", "۱۲", "۹۹٫۸٪"],
  };
  return pools[role][index % pools[role].length];
}

function render() {
  const route = currentRoute();
  if (route.mode === "access") {
    renderAccess();
    return;
  }
  renderApp(route.role, route.key);
}

function nextPage(page) {
  const pages = pagesByRole[page.role];
  return pages[Math.min(page.index + 1, pages.length - 1)];
}

document.addEventListener("click", (event) => {
  const enter = event.target.closest("[data-enter-role]");
  if (enter) {
    const role = enter.dataset.enterRole;
    location.hash = routeFor(role, ROLE_META[role].default);
    return;
  }

  const switcher = event.target.closest("[data-switch-role]");
  if (switcher) {
    const role = switcher.dataset.switchRole;
    location.hash = routeFor(role, ROLE_META[role].default);
    return;
  }

  if (event.target.closest("[data-exit-demo]")) {
    localStorage.removeItem("royadarman-demo-role");
    location.hash = "#/access";
    return;
  }

  if (event.target.closest("[data-open-menu]")) {
    document.querySelector(".sidebar")?.classList.add("is-open");
    document.querySelector(".sidebar-overlay")?.classList.add("is-open");
    document.querySelector("[data-open-menu]")?.setAttribute("aria-expanded", "true");
    document.body.classList.add("nav-open");
    document.querySelector(".sidebar-close")?.focus();
    return;
  }

  if (event.target.closest("[data-close-menu]")) {
    document.querySelector(".sidebar")?.classList.remove("is-open");
    document.querySelector(".sidebar-overlay")?.classList.remove("is-open");
    document.querySelector("[data-open-menu]")?.setAttribute("aria-expanded", "false");
    document.body.classList.remove("nav-open");
    document.querySelector("[data-open-menu]")?.focus();
    return;
  }

  const go = event.target.closest("[data-go]");
  if (go) {
    const [role, key] = go.dataset.go.split("/");
    location.hash = routeFor(role, key);
    return;
  }

  if (event.target.closest("[data-login-demo]")) {
    const route = currentRoute();
    location.hash = routeFor(route.role, ROLE_META[route.role].default);
    showToast("ورود موفق", "به محیط نمایشی رویادَرمان خوش آمدید.");
    return;
  }

  const pageAction = event.target.closest("[data-page-action]");
  if (pageAction) {
    const route = currentRoute();
    const page = pageFor(route.role, route.key);
    const index = Number(pageAction.dataset.pageAction);
    const label = page.actions[index] || "اقدام";
    showToast(label);
    const patientFlowKeys = ["need", "urgency", "location", "time-preferences", "matching", "clinic-detail", "reservation", "checkout", "payment-processing"];
    if (route.role === "patient" && page.key === "urgency" && index === 0) {
      const selected = document.querySelector('input[name="page-choice"]:checked');
      const destination = Number(selected?.value) === page.options.length - 1 ? "location" : "emergency";
      setTimeout(() => { location.hash = routeFor(route.role, destination); }, 320);
      return;
    }
    if (route.role === "patient" && index === 0 && patientFlowKeys.includes(page.key)) {
      const next = nextPage(page);
      setTimeout(() => { location.hash = routeFor(route.role, next.key); }, 320);
    }
    return;
  }

  const toastTrigger = event.target.closest("[data-toast]");
  if (toastTrigger) showToast(toastTrigger.dataset.toast);
});

document.addEventListener("input", (event) => {
  if (event.target.matches("#nav-search")) {
    const query = event.target.value.trim().toLocaleLowerCase("fa");
    document.querySelectorAll("[data-nav-item]").forEach((item) => {
      item.hidden = Boolean(query) && !item.dataset.title.toLocaleLowerCase("fa").includes(query);
    });
  }
  if (event.target.matches("[data-slider]")) {
    event.target.nextElementSibling.textContent = `${event.target.value}٪`;
  }
  if (event.target.classList.contains("otp-box") && event.target.value) {
    const next = event.target.nextElementSibling;
    if (next?.classList.contains("otp-box")) next.focus();
  }
});

document.addEventListener("submit", (event) => {
  if (event.target.matches("[data-demo-form]")) {
    event.preventDefault();
    showToast("اطلاعات ثبت شد");
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    document.querySelector(".sidebar")?.classList.remove("is-open");
    document.querySelector(".sidebar-overlay")?.classList.remove("is-open");
    document.querySelector("[data-open-menu]")?.setAttribute("aria-expanded", "false");
    document.body.classList.remove("nav-open");
    document.querySelector("[data-open-menu]")?.focus();
  }
});

window.addEventListener("hashchange", render);

if (!location.hash) {
  const savedRole = localStorage.getItem("royadarman-demo-role");
  location.hash = savedRole && ROLE_META[savedRole] ? routeFor(savedRole, ROLE_META[savedRole].default) : "#/access";
} else {
  render();
}
</script>
</body>
</html>
