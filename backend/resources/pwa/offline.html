<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#2947A3">
  <title>اتصال اینترنت قطع است · رویادارمان</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18233c;background:#f6f4ee}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(560px,100%);background:#fff;border:1px solid #dfe4ee;border-radius:20px;padding:28px;box-shadow:0 18px 50px rgba(22,43,112,.08)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand img{width:44px;height:44px}.brand strong{font-size:1.1rem;color:#162b70}
    h1{font-size:1.35rem;margin:0 0 10px;color:#162b70}p{line-height:1.9;color:#586279;margin:0 0 18px}
    button{min-height:44px;border:0;border-radius:12px;background:#2947a3;color:#fff;padding:0 18px;font:inherit;font-weight:750;cursor:pointer}
    small{display:block;margin-top:18px;color:#7a8294;line-height:1.7}
  </style>
</head>
<body>
<main>
  <div class="brand"><img src="/assets/brand-mark.svg" alt=""><strong>رویادارمان</strong></div>
  <h1>اتصال اینترنت در دسترس نیست</h1>
  <p>برای حفاظت از اطلاعات، صفحات پنل و داده‌های پرونده روی دستگاه ذخیره نمی‌شوند. پس از برقراری اتصال دوباره صفحه را باز کنید.</p>
  <button type="button" onclick="location.reload()">تلاش دوباره</button>
  <small>این صفحه فقط پیام وضعیت اتصال است و هیچ اطلاعات بیمار یا پرونده‌ای را نمایش نمی‌دهد.</small>
</main>
</body>
</html>
