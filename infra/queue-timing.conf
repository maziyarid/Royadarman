# Royadarman queue reservation contract (non-secret).
#
# COMMITTING THIS FILE DOES NOT CHANGE PRODUCTION WORKERS.
# Source of truth for worker timeout vs Laravel DB_QUEUE_RETRY_AFTER.
# infra/checks/static-guard.sh parses these integers; do not put secrets here.
#
# A still-running job can be reclaimed by another worker when the reservation
# (retry_after) expires at or before --timeout. Keep SAFETY_MARGIN seconds
# between them. Equal values are a double-claim hazard on scanning/notifications.
#
# Live production may override DB_QUEUE_RETRY_AFTER in the host .env.
# royadarman:preflight fail-closes on the actual Laravel config value
# (config('queue.connections.database.retry_after')) and does not inspect systemd.

WORKER_TIMEOUT=85
DB_QUEUE_RETRY_AFTER=90
SAFETY_MARGIN=5
